<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaaYuan Lite</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --panel: #151b24;
  --panel-2: #1b2330;
  --line: #293241;
  --text: #edf2f7;
  --muted: #8d9bad;
  --accent: #d9b36c;
  --accent-soft: rgba(217, 179, 108, 0.13);
  --blue: #7fa7d9;
  --green: #74b88b;
  --red: #df7f7f;
  --amber: #d8a85f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(1100px 500px at 85% -20%, #1d2733 0, transparent 55%), var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  font-size: 14px;
}
button, select { font: inherit; }
.shell { max-width: 1720px; margin: 0 auto; padding: 24px 24px 20px; min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.brand { display: flex; gap: 13px; align-items: center; }
.mark {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; border: 1px solid #5b4c32;
  background: linear-gradient(145deg, #31291d, #1e1b16);
  color: var(--accent); font-weight: 600; font-size: 17px;
}
h1 { margin: 0; font-size: 20px; font-weight: 550; letter-spacing: .2px; }
.sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
.status-wrap { display: flex; gap: 9px; align-items: center; padding-top: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 4px rgba(141,155,173,.08); }
.dot.running, .dot.checking, .dot.starting { background: var(--blue); box-shadow: 0 0 0 4px rgba(127,167,217,.12); }
.dot.completed { background: var(--green); box-shadow: 0 0 0 4px rgba(116,184,139,.12); }
.dot.completed_with_errors, .dot.cancelled, .dot.error { background: var(--red); box-shadow: 0 0 0 4px rgba(223,127,127,.12); }
.dot.interrupted { background: var(--amber); box-shadow: 0 0 0 4px rgba(216,168,95,.12); }
.status-text { color: var(--muted); font-size: 12px; }
.card {
  background: linear-gradient(180deg, rgba(255,255,255,.015), transparent 35%), var(--panel);
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.card-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
.card-title { font-size: 13px; font-weight: 550; letter-spacing: .2px; }
.card-meta { color: var(--muted); font-size: 12px; }
.card-body { padding: 17px 18px; }
.field { margin-bottom: 17px; }
.label { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
.control-bar { margin-bottom: 16px; }
.control-inner { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; padding: 14px 18px 6px; }
.step-strip {
  display: flex; align-items: center; gap: 10px;
  margin: -8px 0 14px; padding: 9px 14px;
  border: 1px solid var(--line); border-radius: 12px;
  background: rgba(255, 255, 255, .022);
  font-size: 12.5px; min-height: 38px;
}
.step-strip.off { display: none; }
.step-tag { color: var(--muted); flex: none; }
.step-label {
  flex: 1 1 auto; min-width: 0; color: var(--accent);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.step-strip.is-node .step-label {
  color: var(--text); opacity: .66;
  font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12px;
}
.step-time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.control-block { display: flex; flex-direction: column; gap: 7px; }
.control-block .label { margin-bottom: 0; }
.train-switch { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.022); }
.train-switch .opt-label { margin: 0; white-space: nowrap; }
.train-btns { display: flex; gap: 6px; flex: 1; min-width: 0; flex-wrap: wrap; }
.train-btn {
  flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  border-radius: 8px; padding: 6px 4px; font-size: 12px; cursor: pointer; transition: .14s ease;
  font-family: inherit; white-space: nowrap;
}
.train-btn:hover:not(:disabled) { border-color: #526176; color: var(--text); }
.train-btn.active { border-color: #74603e; background: var(--accent-soft); color: var(--accent); }
.train-btn:disabled { opacity: .45; cursor: not-allowed; }
.switch-line { display: flex; align-items: center; gap: 10px; }
.switch-hint { color: var(--muted); font-size: 11px; max-width: 260px; line-height: 1.4; }
.switch { position: relative; width: 42px; height: 23px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #354052; border: 1px solid #465266; border-radius: 99px; cursor: pointer; transition: .16s ease; }
.slider:before { content: ""; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; border-radius: 50%; background: #bfcaD8; transition: .16s ease; }
.switch input:checked + .slider { background: #5a482e; border-color: #8b7146; }
.switch input:checked + .slider:before { transform: translateX(19px); background: var(--accent); }
.actions-block { margin-left: auto; flex-direction: row; align-items: center; gap: 8px; }
.actions-block .btn { padding: 9px 14px; }
.action-select {
  background: #121a24; color: var(--text); border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 10px; font-size: 12px; min-width: 140px;
}
.action-select:focus { outline: none; border-color: #526176; }
.link-btn {
  border: 0; background: none; color: var(--blue); font-size: 12px;
  cursor: pointer; padding: 0; font-family: inherit; margin-right: 12px;
}
.link-btn:hover:not(:disabled) { text-decoration: underline; }
.link-btn:disabled { opacity: .4; cursor: not-allowed; }
.workspace { display: grid; grid-template-columns: minmax(230px, 320px) minmax(300px, 420px) minmax(320px, 1fr); gap: 16px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 380px; }
.pane-tabs { display: flex; gap: 4px; padding: 8px 10px 2px; }
.pane-tab {
  flex: 1; border: 1px solid transparent; background: none; color: var(--muted);
  font-size: 12px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
  font-family: inherit; white-space: nowrap; transition: .14s ease;
}
.pane-tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.pane-tab.active { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.pane-tab span { color: #55627a; font-size: 11px; margin-left: 5px; }
.select-all { display: flex; align-items: center; gap: 5px; padding: 0 8px 0 4px; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.select-all input { width: 13px; height: 13px; accent-color: #8b7146; margin: 0; cursor: pointer; }
.pane-crumb { display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumb-root { color: #6d7b8e; font-size: 11px; white-space: nowrap; }
.crumb-sep { color: #46536a; font-size: 11px; }
.options-pane { position: relative; }
.options-pane::before {
  content: ""; position: absolute; left: 0; top: 16px; bottom: 16px;
  width: 2px; background: #6b5636; border-radius: 2px;
}
.task-list { display: flex; flex-direction: column; gap: 4px; padding: 8px; overflow: auto; flex: 1; }
.list-section { display: flex; flex-direction: column; gap: 4px; }
.opt-tip { color: #5f6c7e; font-size: 11px; line-height: 1.5; }
.option-actions { display: flex; flex-direction: column; gap: 8px; margin: 2px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.option-actions .btn { width: 100%; }
.task-row { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 9px; background: rgba(255,255,255,.018); border: 1px solid transparent; cursor: pointer; transition: .14s ease; }
.task-row:hover { border-color: #33404f; background: rgba(255,255,255,.035); }
.task-row.active { border-color: #46556b; background: rgba(127,167,217,.08); }
.task-row.selected { border-color: #7a6440; background: rgba(217,179,108,.1); }
.task-row.done:not(.selected) { opacity: .62; }
.task-index { color: #6e7c8f; font-size: 11px; text-align: center; width: 22px; flex: 0 0 auto; }
.task-check { display: flex; align-items: center; justify-content: center; width: 22px; flex: 0 0 auto; cursor: pointer; }
.task-check input { width: 14px; height: 14px; accent-color: #8b7146; cursor: pointer; margin: 0; }
.task-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.task-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.task-sub { color: #66748a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-flag { color: var(--amber); font-size: 10px; }
.task-note { color: var(--amber); font-weight: 600; }
.task-note-plain { color: var(--amber); }
.task-row.failed .task-name { color: var(--red); }
.option-panel { padding: 14px 18px 18px; overflow: auto; flex: 1; }
.opt-row { display: grid; grid-template-columns: minmax(92px, 132px) 1fr; gap: 10px; align-items: center; padding: 6px 0; }
.opt-label { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt-select, .opt-input {
  width: 100%; background: #121a24; color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; font-size: 12px;
}
.opt-select:focus, .opt-input:focus { outline: none; border-color: #526176; }
.opt-switch-cell { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.opt-switch-cell .switch { position: relative; display: inline-block; width: 42px; height: 23px; flex: 0 0 auto; }
.opt-switch-value { color: var(--muted); font-size: 12px; }
.opt-switch-value.on { color: var(--accent); }
.opt-empty { color: var(--muted); font-size: 12px; padding: 10px 0; line-height: 1.6; }
.opt-group-title { color: #6d7b8e; font-size: 11px; margin: 14px 0 2px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.opt-group-title:first-child { margin-top: 0; }
.log-box { flex: 1; overflow: auto; padding: 10px 0 4px; font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12px; }

.badge { font-size: 10px; padding: 3px 7px; border-radius: 99px; border: 1px solid #3a4658; color: var(--muted); white-space: nowrap; }
.badge.seasonal { color: var(--amber); border-color: #5f4c2f; background: rgba(216,168,95,.07); }
.badge.success { color: var(--green); border-color: #335542; background: rgba(116,184,139,.06); }
.badge.fail { color: var(--red); border-color: #5c3333; background: rgba(223,127,127,.06); }
.badge.timeout { color: var(--amber); border-color: #5f4c2f; background: rgba(216,168,95,.07); }
.badge.run { color: var(--blue); border-color: #354d6d; background: rgba(127,167,217,.06); }
.badge.skip { color: var(--muted); border-color: #3a4658; background: rgba(148,163,184,.06); }
.btn { border-radius: 10px; padding: 11px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); transition: .16s ease; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #526176; background: #222c3a; }
.btn.primary { background: var(--accent); color: #211b11; border-color: var(--accent); font-weight: 550; }
.btn.primary:hover:not(:disabled) { background: #e5c47e; border-color: #e5c47e; }
.btn.ghost { color: var(--muted); }
.btn.danger { color: var(--red); border-color: #543333; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.log-line { display: grid; grid-template-columns: 60px 44px 1fr; gap: 8px; padding: 4px 18px; line-height: 1.55; }
.log-time { color: #5f6c7e; }
.log-level { color: #7d8b9f; font-size: 10px; padding-top: 2px; }
.log-line.error .log-level, .log-line.error .log-message { color: var(--red); }
.log-line.warn .log-level, .log-line.warn .log-message { color: var(--amber); }
.log-message { color: #c6d0dc; word-break: break-word; }
.log-empty { color: var(--muted); padding: 24px 18px; }
.summary { display: flex; gap: 18px; padding: 12px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.summary b { color: var(--text); font-weight: 500; }
.link { color: var(--blue); text-decoration: none; }
.notice { min-height: 18px; margin: 4px 18px 8px; color: var(--muted); font-size: 12px; }
.summary.notice { margin: 0; }
.notice.error { color: var(--red); }
@media (max-width: 1180px) { .workspace { grid-template-columns: minmax(200px, 260px) minmax(240px, 320px) minmax(260px, 1fr); } }
@media (max-width: 900px) { .workspace { grid-template-columns: minmax(170px, 210px) minmax(200px, 250px) minmax(220px, 1fr); } }
@media (max-width: 700px) { .workspace { grid-template-columns: minmax(150px, 180px) minmax(170px, 210px) minmax(190px, 1fr); } }
@media (max-width: 1000px) {
  .train-switch { flex-direction: column; align-items: stretch; gap: 6px; }
  .train-btns { width: 100%; }
  .train-btn { padding: 5px 2px; font-size: 11px; }
}
@media (max-width: 590px) {
  .workspace { grid-template-columns: 1fr; flex: none; }
  .pane { height: auto; max-height: 480px; }
  .actions-block { margin-left: 0; }
  .opt-row { grid-template-columns: 1fr; gap: 4px; }
  .shell { padding: 20px 16px; }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark">鸢</div>
      <div>
        <h1>MaaYuan Lite</h1>
        <div class="sub">如鸢日常收菜 · 轻量运行器</div>
      </div>
    </div>
    <div class="status-wrap">
      <span class="dot" id="statusDot"></span>
      <span class="status-text" id="statusText">正在读取状态</span>
    </div>
  </header>

  <div class="step-strip off" id="stepStrip">
    <span class="step-tag">当前步骤</span>
    <span class="step-label" id="stepLabel"></span>
    <span class="step-time" id="stepTime"></span>
  </div>

  <section class="card control-bar">
    <div class="control-inner">
      <div class="control-block">
        <div class="label">地宫开放期</div>
        <div class="switch-line">
          <label class="switch">
            <input type="checkbox" id="dungeonToggle">
            <span class="slider"></span>
          </label>
          <span class="switch-hint" title="限时日常，默认关闭。开放期打开；检测不到入口会自动跳过，不阻断后续任务。">默认关闭</span>
        </div>
      </div>
      <div class="control-block">
        <div class="label">启动时</div>
        <select class="action-select" id="startupAction">
          <option value="none">只打开界面</option>
          <option value="minimize_only">打开并最小化</option>
          <option value="auto_run">自动运行日常</option>
          <option value="auto_run_minimized">自动运行并最小化</option>
        </select>
      </div>
      <div class="control-block">
        <div class="label">结束后</div>
        <select class="action-select" id="shutdownAction">
          <option value="none">不处理</option>
          <option value="close_maa">关闭 MAA</option>
          <option value="close_both">关闭模拟器和 MAA</option>
        </select>
      </div>
      <div class="control-block actions-block">
        <button class="btn primary" id="startBtn">开始任务</button>
        <button class="btn" id="resumeBtn" disabled>继续未完成</button>
        <button class="btn danger" id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </section>

  <div class="workspace">
    <section class="card pane">
      <div class="card-head">
        <span class="card-title">执行顺序</span>
        <span class="card-meta" id="connectionMeta">连接信息读取中</span>
      </div>
      <div class="pane-tabs" id="scopeTabs">
        <label class="select-all" id="selectAllWrap"><input type="checkbox" id="selectAllDaily">全选</label>
        <button class="pane-tab active" type="button" data-scope="daily">今日日常<span id="dailyCount">0</span></button>
        <button class="pane-tab" type="button" data-scope="library">其他任务<span id="libraryCount">0</span></button>
      </div>
      <div class="task-list" id="taskList"></div>
    </section>

    <section class="card pane options-pane">
      <div class="card-head">
        <span class="pane-crumb">
          <span class="crumb-root" id="optionRoot">执行顺序</span>
          <span class="crumb-sep">›</span>
          <span class="card-title" id="optionTitle">任务选项</span>
        </span>
        <span class="card-meta" id="optionMeta"></span>
      </div>
      <div class="option-panel" id="optionPanel">
        <div class="opt-empty">从左侧选择一个任务，这里会显示它的可调选项。</div>
      </div>
    </section>

    <section class="card pane">
      <div class="card-head">
        <span class="card-title">运行日志</span>
        <span class="card-meta">
          <button class="link-btn" type="button" id="checkBtn">检查连接</button>
          <a class="link" href="/api/screenshot" target="_blank" rel="noreferrer">最近截图</a>
        </span>
      </div>
      <div class="log-box" id="logBox"><div class="log-empty">尚未开始运行。</div></div>
      <div class="summary notice" id="notice"></div>
    </section>
  </div>
</div>

<script>
const statusMap = {
  idle: "待机", starting: "正在启动", running: "正在执行", checking: "正在检查连接",
  completed: "日常完成", completed_with_errors: "完成但有失败", cancelled: "已停止", error: "运行异常",
  interrupted: "上次未完成"
};
const taskStatusMap = { pending: "等待", running: "执行中", succeeded: "完成", failed: "失败", timed_out: "超时", skipped: "跳过", cancelled: "已停止", skipped_no_resource: "未领取" };
const TRAINING_TASKS = { 修为: "💎 修为历练", 铜钱: "💲 铜钱历练", 经验: "⚔️ 经验历练" };
const TRAINING_BUTTONS = { 修为: "💎 修为", 铜钱: "💲 铜钱", 经验: "⚔️ 经验" };

function trainingTypeOf(name) {
  for (const [type, taskName] of Object.entries(TRAINING_TASKS)) {
    if (taskName === name) return type;
  }
  return "";
}

function taskLabel(name) {
  return trainingTypeOf(name) ? "历练" : name;
}

function taskIcon(name) {
  return trainingTypeOf(name) ? `${name.split(" ")[0]} ` : "";
}
let training = "修为";
let dungeon = false;
let lastState = null;
let planTasks = [];
let planSkipped = [];
let manualScroll = false;
let logSeq = 0;
let logRunId = null;
let logPrimed = false;
let taskOptionsByName = {};
let allPackages = [];
let hiddenTasks = new Set();
let pinnedTasks = [];
let dailyTaskNames = new Set();
let libraryTasks = [];
let libraryOpen = false;
let listScope = "daily";
const checkedTasks = new Set();
let seenDaily = new Set();
let planHour = new Date().getHours();
let automation = { startup_action: "none", shutdown_action: "none" };
let lastTaskListSignature = "";
let selectedTask = "";
try {
  selectedTask = localStorage.getItem("lite-selected-task") || "";
  const savedTraining = localStorage.getItem("lite-training");
  if (TRAINING_TASKS[savedTraining]) training = savedTraining;
  dungeon = localStorage.getItem("lite-dungeon") === "1";
  libraryOpen = localStorage.getItem("lite-library-open") === "1";
  const savedScope = localStorage.getItem("lite-list-scope");
  if (savedScope === "daily" || savedScope === "library") listScope = savedScope;
} catch (error) { /* ignore broken storage */ }
if (location.hash.startsWith("#task=")) {
  selectedTask = decodeURIComponent(location.hash.slice(6));
}

function rememberSelectedTask() {
  try {
    localStorage.setItem("lite-selected-task", selectedTask);
    localStorage.setItem("lite-training", training);
    localStorage.setItem("lite-dungeon", dungeon ? "1" : "0");
  } catch (error) { /* ignore */ }
}

const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

async function fetchPlan(preferTraining = false) {
  const response = await fetch(`/api/plan?training=${encodeURIComponent(training)}&dungeon=${dungeon ? 1 : 0}`);
  const data = await response.json();
  if (data.error) { setNotice(data.error, true); return; }
  planTasks = data.tasks || [];
  planSkipped = data.skipped || [];
  planHour = new Date().getHours();
  // 不在计划里的日常（地宫关掉、每日进膳不在开放时段）清掉勾选与"见过"记录：
  // 隐藏的项不该继承上一次的勾选状态，重新开放时按新任务处理（默认勾上）。
  const currentNames = new Set(planTasks.map(task => task.name));
  for (const name of Array.from(seenDaily)) {
    if (!currentNames.has(name)) {
      seenDaily.delete(name);
      checkedTasks.delete(name);
    }
  }
  // 新出现的任务默认勾上：首次进界面、地宫/每日进膳刚开放。用户取消过的不会被重新勾回。
  for (const task of planTasks) {
    if (!seenDaily.has(task.name)) {
      seenDaily.add(task.name);
      checkedTasks.add(task.name);
    }
  }
  const preferred = TRAINING_TASKS[training];
  const names = planTasks.map(task => task.name);
  const staleTraining = trainingTypeOf(selectedTask) && !names.includes(selectedTask);
  if (preferTraining && names.includes(preferred)) {
    selectedTask = preferred;
  } else if (!selectedTask || staleTraining) {
    selectedTask = names.includes(preferred) ? preferred : (names[0] || "");
  }
  rememberSelectedTask();
  rebuildLibrary();
  renderTaskList(true);
  renderOptionPanel();
}

function optionSummary(name) {
  const task = taskOptionsByName[name];
  if (!task) return "";
  const primary = [];
  const secondary = [];
  for (const group of task.groups) {
    if (group.type === "input" || group.depth > 0) continue;
    const value = group.cases && group.cases[group.selected];
    if (value == null) continue;
    if (group.type === "select") primary.push(value); else secondary.push(value);
  }
  const parts = primary.length >= 2
    ? primary.slice(0, 3)
    : [...primary, ...secondary].slice(0, 3);
  return parts.join(" · ");
}

function mergeHistory(tasks, history) {
  if (!history || !history.length) return tasks;
  const past = new Map(history.map(item => [item.name, item]));
  return tasks.map(task => {
    const previous = past.get(task.name);
    if (!previous) return task;
    return {
      ...task,
      status: previous.status,
      duration: previous.duration,
      attempts: previous.attempts,
      note: previous.note || ""
    };
  });
}

function subLine(summary, status, note) {
  // 「未领取到资源」放行首：接在任务名后面会被省略号吃掉。
  const parts = [];
  if (status === "skipped_no_resource") parts.push('<b class="task-note">未领取到资源</b>');
  else if (note) parts.push(`<span class="task-note-plain">${esc(note)}</span>`);
  if (summary) parts.push(esc(summary));
  return parts.length ? `<span class="task-sub">${parts.join(" · ")}</span>` : "";
}

function taskRowHtml(task, label, single, withCheckbox = false) {
  const result = single && Array.isArray(single.results)
    ? single.results.find(item => item.name === task.name)
    : null;
  const status = result
    ? result.status
    : (single && single.name === task.name ? single.status : task.status);
  const running = status === "running" || status === "pending";
  const active = running ? " active" : (status === "succeeded" || status === "failed" || status === "timed_out" || status === "cancelled" || status === "skipped" || status === "skipped_no_resource") ? " done" : "";
  const selected = task.name === selectedTask ? " selected" : "";
  const failedCls = (status === "failed" || status === "timed_out") ? " failed" : "";
  let flag = "";
  if (status) {
    const cls = status === "succeeded" ? "success"
      : status === "failed" ? "fail"
      : status === "timed_out" ? "timeout"
      : running ? "run"
      : status === "skipped" ? "skip" : "";
    flag = `<span class="badge ${cls}">${taskStatusMap[status] || status}</span>`;
  } else if (task.kind === "seasonal_daily") {
    flag = '<span class="badge seasonal">限时</span>';
  }
  const summary = optionSummary(task.name);
  const box = `<label class="task-check"><input type="checkbox" data-check="${esc(task.name)}"${checkedTasks.has(task.name) ? " checked" : ""}></label>`;
  const marker = withCheckbox ? box : `${box}<span class="task-index">${label}</span>`;
  return `<div class="task-row${active}${selected}${failedCls}" data-name="${esc(task.name)}">
    ${marker}
    <span class="task-main">
      <span class="task-name">${esc(taskIcon(task.name) + taskLabel(task.name))}</span>
      ${subLine(summary, status, task.note)}
    </span>
    ${flag}
  </div>`;
}

function renderTaskList(force = false) {
  const busy = lastState && lastState.busy;
  const stateTasks = lastState && lastState.tasks && lastState.tasks.length ? lastState.tasks : null;
  const daily = (busy || !planTasks.length) && stateTasks
    ? stateTasks
    : mergeHistory(planTasks, stateTasks);
  const single = lastState && lastState.single;
  if (libraryTasks.some(task => task.name === selectedTask)) libraryOpen = true;

  const signature = JSON.stringify([
    daily.map(task => [task.name, task.status || "", task.note || "", task.duration || 0, task.kind || ""]),
    libraryTasks.map(task => task.name),
    single ? [single.name, single.status, (single.results || []).length] : null,
    busy ? 1 : 0,
    selectedTask,
    listScope,
    Array.from(checkedTasks).sort(),
    Object.keys(taskOptionsByName).sort()
  ]);
  if (!force && signature === lastTaskListSignature) return;
  lastTaskListSignature = signature;

  const library = listScope === "library";
  const shown = library ? libraryTasks : daily;
  const rows = shown
    .map((task, index) =>
      taskRowHtml(task, String(index + 1).padStart(2, "0"), single, false)
    )
    .join("");

  $("taskList").innerHTML = rows || '<div class="opt-empty">这一组暂时没有任务。</div>';
  $("dailyCount").textContent = String(daily.length);
  $("libraryCount").textContent = String(libraryTasks.length);
  document.querySelectorAll("#scopeTabs .pane-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.scope === listScope);
  });

  const selectedRow = $("taskList").querySelector(".task-row.selected");
  if (selectedRow && selectedRow.scrollIntoView) {
    selectedRow.scrollIntoView({ block: "nearest" });
  }
  syncSelectAll();
}

function currentPool() {
  return listScope === "library" ? libraryTasks : planTasks;
}

function syncSelectAll() {
  const wrap = $("selectAllWrap");
  if (!wrap) return;
  wrap.style.display = listScope === "library" ? "none" : "";
  if (listScope === "library") return;
  const pool = planTasks;
  $("selectAllDaily").checked = pool.length > 0 && pool.every(task => checkedTasks.has(task.name));
}

function trainSwitchHtml(current) {
  const busy = Boolean(lastState && lastState.busy);
  const buttons = Object.keys(TRAINING_TASKS)
    .map(type =>
      `<button class="train-btn${type === current ? " active" : ""}" type="button" data-train-type="${esc(type)}"${busy ? " disabled" : ""}>${esc(TRAINING_BUTTONS[type])}</button>`
    )
    .join("");
  return `<div class="train-switch">
    <span class="opt-label">历练类型</span>
    <div class="train-btns">${buttons}</div>
  </div>`;
}

function switchIndexes(group) {
  const cases = group.cases || [];
  const yes = cases.indexOf("Yes");
  const no = cases.indexOf("No");
  if (yes >= 0 && no >= 0) return { on: yes, off: no };
  return { on: 1, off: 0 };
}

function renderOptionPanel() {
  const panel = $("optionPanel");
  const task = taskOptionsByName[selectedTask];
  const trainType = trainingTypeOf(selectedTask);
  const switchHtml = trainType ? trainSwitchHtml(trainType) : "";
  const inDaily = planTasks.some(item => item.name === selectedTask);
  $("optionRoot").textContent = selectedTask
    ? (inDaily ? "今日日常" : "其他任务")
    : "执行顺序";
  $("optionTitle").textContent = selectedTask ? taskLabel(selectedTask) : "任务选项";
  if (!selectedTask) {
    $("optionMeta").textContent = "";
    panel.innerHTML = '<div class="opt-empty">从左侧选择一个任务，这里会显示它的可调选项。</div>';
    return;
  }
  const inLibrary = !inDaily;
  const tipText = inLibrary
    ? "点右上角「开始任务」单独执行这一项。"
    : "勾选左侧这一项后，点右上角「开始任务」执行。";
  const tip = `<div class="opt-tip" style="margin-top:14px">${tipText}</div>`;
  if (!task || !task.groups.length) {
    $("optionMeta").textContent = "";
    panel.innerHTML =
      switchHtml +
      '<div class="opt-empty">该任务没有可调选项，会按默认设置执行。</div>' + tip;
    return;
  }
  $("optionMeta").textContent = `${task.groups.length} 项可调`;
  const rows = task.groups.map(group => {
    if (group.type === "input") {
      return group.fields.map(field => `
        <div class="opt-row">
          <span class="opt-label" title="${esc(field.description || "")}">${esc(field.label)}</span>
          <input class="opt-input" data-task="${esc(task.name)}" data-group="${esc(group.group)}" data-field="${esc(field.name)}" value="${esc(field.value)}">
        </div>`).join("");
    }
    const cases = group.cases || [];
    const binary = cases.length === 2 && (group.type === "switch" || group.type === "select");
    if (binary) {
      const pair = switchIndexes(group);
      const on = group.selected === pair.on;
      return `
        <div class="opt-row">
          <span class="opt-label">${esc(group.group)}</span>
          <div class="opt-switch-cell">
            <label class="switch">
              <input type="checkbox" class="opt-switch" data-task="${esc(task.name)}" data-group="${esc(group.group)}"${on ? " checked" : ""}>
              <span class="slider"></span>
            </label>
            <span class="opt-switch-value${on ? " on" : ""}">${esc(cases[group.selected] != null ? cases[group.selected] : "")}</span>
          </div>
        </div>`;
    }
    const options = cases.map((name, index) =>
      `<option value="${index}"${index === group.selected ? " selected" : ""}>${esc(name)}</option>`).join("");
    return `
      <div class="opt-row">
        <span class="opt-label">${esc(group.group)}</span>
        <select class="opt-select" data-task="${esc(task.name)}" data-group="${esc(group.group)}">${options}</select>
      </div>`;
  }).join("");
  panel.innerHTML = switchHtml + rows + tip;
}

function setNotice(message, error = false) {
  const el = $("notice");
  el.textContent = message || "";
  el.className = "summary notice" + (error ? " error" : "");
  // 即时提示会被下一次点击覆盖；失败必须留痕。
  if (error && message) {
    fetch("/api/note", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message, level: "warn" })
    }).catch(() => {});
  }
}

function clearLogs() {
  $("logBox").innerHTML = "";
  manualScroll = false;
}

function appendLogs(lines) {
  const box = $("logBox");
  if (!lines || !lines.length) return;
  const empty = box.querySelector(".log-empty");
  if (empty) empty.remove();
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const fragment = document.createDocumentFragment();
  for (const line of lines) {
    const row = document.createElement("div");
    row.className = `log-line ${line.level}`;
    const time = document.createElement("span");
    time.className = "log-time";
    time.textContent = line.time;
    const level = document.createElement("span");
    level.className = "log-level";
    level.textContent = String(line.level || "").toUpperCase();
    const message = document.createElement("span");
    message.className = "log-message";
    message.textContent = line.message;
    row.append(time, level, message);
    fragment.appendChild(row);
  }
  box.appendChild(fragment);
  while (box.childElementCount > 800) box.removeChild(box.firstElementChild);
  if (nearBottom || !manualScroll) box.scrollTop = box.scrollHeight;
}

async function refresh() {
  try {
    if (new Date().getHours() !== planHour) {
      await fetchPlan();
    }
    const response = await fetch(
      logPrimed ? `/api/state?since=${logSeq}` : "/api/state?since=latest"
    );
    const state = await response.json();
    lastState = state;
    const status = state.status || "idle";
    const single = state.single;
    const singleActive = single && (single.status === "pending" || single.status === "running");
    const total = single && single.total ? single.total : 1;
    const current = single && single.index != null ? single.index + 1 : 1;
    $("statusDot").className = "dot " + status;
    $("statusText").textContent = singleActive
      ? (total > 1
          ? `运行中：${single.name}（${current}/${total}）`
          : `单独运行：${single.name}`)
      : (statusMap[status] || status);
    // 当前节点：上游在 pipeline 里用 focus 写好了一句中文进度，有就用它；
    // 没有 focus 的节点退回节点名，用等宽字体弱化，方便对照日志。
    const step = state.step;
    const strip = $("stepStrip");
    if (step && singleActive) {
      strip.classList.remove("off");
      strip.classList.toggle("is-node", !step.focus);
      $("stepLabel").textContent = step.label || step.node || "";
      $("stepLabel").title = step.node || "";
      $("stepTime").textContent = step.at || "";
    } else {
      strip.classList.add("off");
    }
    $("connectionMeta").textContent = state.config ? `${state.config.adbSerial} · 简中` : "";
    $("resumeBtn").disabled = state.busy || !state.canResume;
    $("checkBtn").disabled = state.busy;
    $("stopBtn").disabled = !state.busy;
    syncStartButton();
    renderTaskList();
    const reset = state.runId !== logRunId;
    logRunId = state.runId;
    logSeq = state.logSeq || 0;
    if (!logPrimed || reset) {
      // A freshly opened window (or a restarted console) starts with an empty
      // log box; only output produced from now on is shown.
      logPrimed = true;
      clearLogs();
    } else {
      appendLogs(state.logs || []);
    }
  } catch (error) {
    $("statusText").textContent = "控制台连接中断";
    // 断连后步骤条会停在最后一次快照上，留着反而误导。
    $("stepStrip").classList.add("off");
  }
}

$("optionPanel").addEventListener("click", async event => {
  const button = event.target.closest("[data-train-type]");
  if (!button) return;
  const type = button.dataset.trainType;
  if (!type || type === training || !TRAINING_TASKS[type]) return;
  if (lastState && lastState.busy) return;
  training = type;
  selectedTask = TRAINING_TASKS[type];
  rememberSelectedTask();
  await fetchPlan(true);
  setNotice(`历练类型已切换为「${type}」`);
});

$("dungeonToggle").addEventListener("change", event => {
  if (lastState && lastState.busy) { event.target.checked = dungeon; return; }
  dungeon = event.target.checked;
  rememberSelectedTask();
  fetchPlan();
});

function checkedIn(pool) {
  return pool.map(task => task.name).filter(name => checkedTasks.has(name));
}

function syncStartButton() {
  const busy = Boolean(lastState && lastState.busy);
  const daily = checkedIn(planTasks).length;
  const extra = checkedIn(libraryTasks).length;
  const count = daily + extra;
  $("startBtn").textContent = count ? `开始任务（${count}）` : "开始任务";
  $("startBtn").title = count ? `今日日常 ${daily} 项 · 其他任务 ${extra} 项` : "先勾选要执行的任务";
  $("startBtn").disabled = busy || !count;
}

$("startBtn").addEventListener("click", async () => {
  setNotice("");
  // 勾选跨两个页签累计：点了这个按钮，两边勾上的都会跑。
  const daily = checkedIn(planTasks);
  const extra = checkedIn(libraryTasks);
  if (!daily.length && !extra.length) {
    setNotice("请先勾选要执行的任务", true);
    return;
  }
  // 只勾了其他任务时走独立批量，不覆盖今天的日常进度。
  const response = !daily.length
    ? await fetch("/api/run-task", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ names: extra })
      })
    : await fetch("/api/start", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ training, dungeon, names: daily, extra })
      });
  const data = await response.json();
  if (!response.ok) {
    setNotice(data.error || "无法启动任务", true);
  } else {
    const breakdown = extra.length ? `（日常 ${daily.length} 项 + 其他 ${extra.length} 项）` : "";
    setNotice(`正在运行 ${daily.length + extra.length} 项${breakdown}：${daily.concat(extra).join(" → ")}`);
  }
  await refresh();
});

$("selectAllDaily").addEventListener("change", event => {
  const pool = planTasks;
  if (event.target.checked) {
    for (const task of pool) checkedTasks.add(task.name);
  } else {
    for (const task of pool) checkedTasks.delete(task.name);
  }
  lastTaskListSignature = "";
  renderTaskList();
  syncStartButton();
});

$("resumeBtn").addEventListener("click", async () => {
  setNotice("");
  const response = await fetch("/api/start", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({training, dungeon, resume: true})
  });
  const data = await response.json();
  if (!response.ok) setNotice(data.error || "没有可继续的任务", true);
  await refresh();
});

$("checkBtn").addEventListener("click", async () => {
  setNotice("正在检查连接，不会执行游戏任务。");
  const response = await fetch("/api/check", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
  if (!response.ok) setNotice("连接检查未启动", true);
  await refresh();
});

$("stopBtn").addEventListener("click", async () => {
  await fetch("/api/stop", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
  setNotice("收到停止请求，正在结束当前任务……");
  await refresh();
});

$("logBox").addEventListener("scroll", () => {
  manualScroll = $("logBox").scrollHeight - $("logBox").scrollTop - $("logBox").clientHeight > 80;
});

function renderAutomation() {
  $("startupAction").value = automation.startup_action || "none";
  $("shutdownAction").value = automation.shutdown_action || "none";
}

async function postSettings(patch) {
  try {
    const response = await fetch("/api/settings", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(patch)
    });
    const data = await response.json();
    if (data.settings) {
      automation = data.settings;
      renderAutomation();
    }
  } catch (error) { /* keep UI as is */ }
}

async function fetchSettings() {
  try {
    const response = await fetch("/api/settings");
    automation = await response.json();
    renderAutomation();
  } catch (error) { /* keep defaults */ }
}

async function fetchOptions() {
  try {
    const [dailyRes, allRes] = await Promise.all([
      fetch("/api/task-options?scope=daily"),
      fetch("/api/task-options?scope=all")
    ]);
    const dailyData = await dailyRes.json();
    const allData = await allRes.json();
    if (dailyData.error || allData.error) return;
    taskOptionsByName = {};
    for (const task of allData.tasks || []) taskOptionsByName[task.name] = task;
    allPackages = (allData.tasks || []).filter(task => !/^=/.test(task.name));
    hiddenTasks = new Set(allData.hidden || []);
    pinnedTasks = allData.pinned || [];
    dailyTaskNames = new Set((dailyData.tasks || []).map(task => task.name));
    rebuildLibrary();
    const pool = listScope === "library" ? libraryTasks : planTasks;
    if (!selectedTask || !pool.some(task => task.name === selectedTask)) {
      selectedTask = pool.length ? pool[0].name : "";
      rememberSelectedTask();
    }
    renderTaskList(true);
    renderOptionPanel();
  } catch (error) { /* keep the list usable without options */ }
}

function rebuildLibrary() {
  const inPlan = new Set(planTasks.map(task => task.name));
  const pinOrder = new Map(pinnedTasks.map((name, index) => [name, index]));
  libraryTasks = allPackages
    .filter(task => !inPlan.has(task.name) && !hiddenTasks.has(task.name))
    .map(task => ({ name: task.name, kind: "library" }))
    .sort((a, b) => {
      const left = pinOrder.has(a.name) ? pinOrder.get(a.name) : pinnedTasks.length;
      const right = pinOrder.has(b.name) ? pinOrder.get(b.name) : pinnedTasks.length;
      return left - right;
    });
}

async function saveOption(payload) {
  const response = await fetch("/api/task-options", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  const data = await response.json();
  if (!response.ok) { setNotice(data.error || "保存失败", true); return false; }
  if (data.task) {
    taskOptionsByName[data.task.name] = data.task;
    renderTaskList(true);
    if (data.task.name === selectedTask) renderOptionPanel();
  }
  setNotice(`已保存：${payload.group}（下次运行生效）`);
  return true;
}

$("scopeTabs").addEventListener("click", event => {
  const tab = event.target.closest("[data-scope]");
  if (!tab) return;
  const scope = tab.dataset.scope;
  if (scope === listScope) return;
  listScope = scope;
  try {
    localStorage.setItem("lite-list-scope", scope);
  } catch (error) { /* ignore */ }
  const pool = scope === "library" ? libraryTasks : planTasks;
  if (!pool.some(task => task.name === selectedTask) && pool.length) {
    selectedTask = pool[0].name;
    rememberSelectedTask();
  }
  renderTaskList(true);
  renderOptionPanel();
  syncStartButton();
});

$("taskList").addEventListener("click", event => {
  if (event.target.closest(".task-check")) return;
  const row = event.target.closest(".task-row");
  if (!row) return;
  const name = row.dataset.name;
  if (!name || name === selectedTask) return;
  selectedTask = name;
  rememberSelectedTask();
  renderTaskList(true);
  renderOptionPanel();
});

$("taskList").addEventListener("change", event => {
  const box = event.target.closest("[data-check]");
  if (!box) return;
  const name = box.dataset.check;
  if (box.checked) checkedTasks.add(name); else checkedTasks.delete(name);
  syncSelectAll();
  syncStartButton();
});

$("startupAction").addEventListener("change", async event => {
  const value = event.target.value;
  const label = event.target.selectedOptions[0].textContent;
  await postSettings({ startup_action: value });
  setNotice(`启动动作：${label}（下次启动生效）`);
});

$("shutdownAction").addEventListener("change", async event => {
  const value = event.target.value;
  const label = event.target.selectedOptions[0].textContent;
  await postSettings({ shutdown_action: value });
  setNotice(`结束动作：${label}`);
});

$("optionPanel").addEventListener("change", event => {
  const target = event.target;
  const task = target.dataset.task;
  const group = target.dataset.group;
  if (!task || !group) return;
  if (target.classList.contains("opt-select")) {
    saveOption({ task, group, index: Number(target.value) });
  } else if (target.classList.contains("opt-switch")) {
    const definition = taskOptionsByName[task];
    const item = definition && (definition.groups || []).find(entry => entry.group === group);
    const pair = item ? switchIndexes(item) : { on: 1, off: 0 };
    const wanted = target.checked;
    saveOption({ task, group, index: wanted ? pair.on : pair.off }).then(ok => {
      if (!ok) target.checked = !wanted;
    });
  } else if (target.classList.contains("opt-input")) {
    saveOption({ task, group, inputs: { [target.dataset.field]: target.value } });
  }
});

$("dungeonToggle").checked = dungeon;
syncStartButton();

function scheduleRefresh() {
  const delay = document.hidden ? 5000 : (lastState && lastState.busy ? 1000 : 2000);
  setTimeout(async () => {
    if (!document.hidden) await refresh();
    scheduleRefresh();
  }, delay);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});

fetchPlan().then(refresh);
fetchOptions();
fetchSettings();
scheduleRefresh();
</script>
